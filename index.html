<html lang="hi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sorry Priya Ji 🥺</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥺</text></svg>">
  <style>
    :root {
      --bg1: #ffe3ec;
      --bg2: #ffc9de;
      --card: #fffafc;
      --ink: #4a1d33;
      --soft: #a8587d;
      --pink: #ff5c8a;
      --pink2: #ff8fb1;
      --no: #eadfe5;
      --noink: #6b4a5a;
      --shadow: rgba(255, 92, 138, .28)
    }

    @media (prefers-color-scheme:dark) {
      :root {
        --bg1: #2a1020;
        --bg2: #3d1630;
        --card: #3a1a2e;
        --ink: #ffe6ef;
        --soft: #ffb3cd;
        --no: #55354a;
        --noink: #ffd9e6;
        --shadow: rgba(0, 0, 0, .4)
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      max-width: 100%;
      overflow-x: hidden
    }

    body {
      font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom)
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0
    }

    .hearts span {
      position: absolute;
      bottom: -50px;
      animation: rise linear infinite;
      opacity: .5
    }

    @keyframes rise {
      to {
        transform: translateY(-115vh) rotate(25deg)
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: calc(100% - 28px);
      max-width: 440px;
      margin: 18px auto;
      overflow: hidden;
      background: var(--card);
      border-radius: 30px;
      padding: 18px 18px 26px;
      text-align: center;
      box-shadow: 0 14px 40px var(--shadow)
    }

    .stage {
      position: relative;
      width: 100%;
      height: min(40vh, 300px);
      display: flex;
      align-items: center;
      justify-content: center
    }

    .stk {
      max-width: 88%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .18));
      animation: pop .5s ease
    }

    .bob {
      animation: pop .5s ease, bob 2.6s ease-in-out .5s infinite
    }

    .shake {
      animation: pop .5s ease, shk .5s ease-in-out .5s infinite
    }

    .yay {
      animation: pop .5s ease, jump 1s ease-in-out .5s infinite
    }

    @keyframes bob {
      50% {
        transform: translateY(-8px) rotate(-1.2deg)
      }
    }

    @keyframes shk {
      25% {
        transform: translateX(-4px) rotate(-1.5deg)
      }

      75% {
        transform: translateX(4px) rotate(1.5deg)
      }
    }

    @keyframes jump {
      50% {
        transform: translateY(-14px) scale(1.03)
      }
    }

    .fl {
      position: absolute;
      animation: bob 2.2s ease-in-out infinite
    }

    @keyframes pop {
      from {
        transform: scale(.8);
        opacity: 0
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    h1 {
      overflow-wrap: anywhere;
      font-size: 1.4rem;
      line-height: 1.3;
      margin: 12px 0 6px
    }

    p {
      color: var(--soft);
      margin: 0 0 16px;
      font-size: .98rem;
      line-height: 1.5
    }

    .btns {
      display: flex;
      gap: 14px;
      justify-content: center;
      align-items: center;
      min-height: 70px;
      flex-wrap: wrap
    }

    button,
    a.btn {
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 999px;
      padding: 13px 22px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block
    }

    #yes,
    a.btn {
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color: #fff;
      box-shadow: 0 6px 16px var(--shadow);
      transition: transform .2s
    }

    #no {
      background: var(--no);
      color: var(--noink);
      transition: left .22s, top .22s
    }

    #no.run {
      position: fixed;
      z-index: 5
    }

    .note {
      font-size: .88rem;
      margin-top: 12px;
      color: var(--soft)
    }

    .bub {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-weight: 700
    }
  </style>
</head>

    function sc(img, cls, extra) { return '<div class="stage"><img class="stk ' + (cls || "") + '" src="' + IMG[img] + '" alt="">' + (extra || "") + '</div>' }
    function fl(e, x, y, d, s) { return '<span class="fl" style="left:' + x + '%;top:' + y + '%;animation-delay:' + d + 's;font-size:' + (s || 26) + 'px">' + e + '</span>' }
    var scenes = {
      sorry: function () { return sc("sorry", "bob", fl("💧", 6, 22, 0) + fl("🥺", 84, 8, .4) + fl("💗", 86, 62, .8)) },
      angry: function () { return sc("angry", "bob", fl("😤", 50, 0, 0) + fl("🥹", 4, 8, .5) + fl("💢", 90, 22, .9)) },
      text: function () { return sc("text", "bob", fl("📱", 44, 2, 0) + fl("😒", 90, 6, .5) + fl("🙏", 4, 72, .9)) },
      wait: function () { return sc("wait", "bob", fl("⏰", 6, 8, 0, 32) + fl("🥺", 86, 6, .5, 28) + fl("💗", 88, 64, .9)) },
      pray: function () { return sc("sorry", "shake", fl("🙏", 8, 6, 0, 34) + fl("😭", 86, 10, .4, 30) + fl("💔", 84, 70, .8)) },
      yay: function () { return sc("priya", "yay", fl("💖", 4, 10, 0, 32) + fl("✨", 88, 8, .4, 30) + fl("🥳", 86, 60, .8, 32) + fl("🎉", 2, 60, .3, 30)) }
    };
    var screens = [
      { sc: "sorry", t: "Sorry na Priya ji, maan jao please 🥺", s: "Galti ho gayi mujhse... ab toh maaf kar do na 🙏" },
      { sc: "angry", t: "Maan jao na devi ji 🥹", s: "Dekho main kitna pyaara sa sorry bol raha hu. Itna gussa sehat ke liye achha nahi!" },
      { sc: "text", t: "Please please please 🥺👉👈", s: "Aap \"kal baat karti hu\" bol ke busy ho, aur main yaha mooh phulaye baitha hu. Thoda rehem karo!" },
      { sc: "wait", t: "Kab se wait kar raha hu ⏰", s: "Bas ek \"haan\" ka intezaar hai. Itna bhi kya gussa, ab maan jao na 🥺" },
      { sc: "pray", t: "Ab \"Nahi\" wala button bhi bhaag gaya 😂", s: "Pakad ke dikhao! Sirf ek hi raasta bacha hai 😜" }
    ];

    /* ====== LOGIC ====== */
    function grow(b) { var s = Math.min(yesScale, 1.3); b.style.fontSize = (16 * s) + "px"; b.style.padding = (13 * s) + "px " + (22 * s) + "px" }
    var step = 0, yesScale = 1, noEl = null, card = document.getElementById("card");
    function render() {
      var d = screens[Math.min(step, screens.length - 1)];
      card.innerHTML = scenes[d.sc]() + '<h1>' + d.t + '</h1><p>' + d.s + '</p><div class="btns" id="btns"><button id="yes">Ok maan gayi 💖</button><button id="no">Nahi maan na 😤</button></div>';
      var y = document.getElementById("yes"); grow(y); y.onclick = yesScreen;
      noEl = document.getElementById("no");
      if (step >= screens.length - 1) startRun();
      else noEl.onclick = function () { step++; yesScale = Math.min(yesScale + .1, 1.3); render() };
    }
    var lines = ["Pakad ke dikhao 😜", "Nope, miss! 🏃", "Itna aasan nahi 😂", "Yes dabao na 🥺", "Haha bhaag gaya! 💨", "Maan jao yaar 🙈"];
    function startRun() {
      var r = noEl.getBoundingClientRect(), n = 0;
      var ph = document.createElement("span"); ph.style.cssText = "display:inline-block;width:" + r.width + "px;height:" + r.height + "px";
      noEl.classList.add("run"); noEl.style.left = r.left + "px"; noEl.style.top = r.top + "px";
      document.getElementById("btns").appendChild(ph);
      function dodge(e) {
        if (e) { e.preventDefault(); e.stopPropagation() }
        var w = noEl.offsetWidth, h = noEl.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
        noEl.style.left = (8 + Math.random() * Math.max(1, vw - w - 16)) + "px";
        noEl.style.top = (8 + Math.random() * Math.max(1, vh - h - 16)) + "px";
        noEl.textContent = lines[n++ % lines.length];
        yesScale = Math.min(yesScale + .03, 1.3);
        var yb = document.getElementById("yes"); if (yb) grow(yb);
      }
      ["pointerenter", "touchstart", "mousedown", "click", "focus"].forEach(function (ev) { noEl.addEventListener(ev, dodge, { passive: false }) });
    }
    function yesScreen() {
      card.innerHTML = scenes.yay() + '<h1>Shhh... ab kuch mat bolo 🤫💖</h1><p>Yayyy! Thank you Priya ji, aap sach mein best ho! Ab hum phir se best friends 🫶</p><div class="note" id="st"></div>';
      confetti(); sendMail();
    }
    function sendMail() {
      var st = document.getElementById("st");
      var msg = "Priya ji ne sorry accept kar liya aur 'Ok maan gayi' button daba diya! 🥳💖 Ab jaldi se treat de do 😄";
      var ok = false;
      var p1 = fetch("https://ntfy.sh/", {
        method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
        body: JSON.stringify({ topic: NTFY_TOPIC, title: "Priya ji maan gayi! 🎉💖", message: msg, priority: 5, tags: ["tada", "heart"], email: TO_EMAIL })
      })
        .then(function (r) { if (r.ok) ok = true }).catch(function () { });
      var p2 = fetch(FORM_URL, {
        method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, keepalive: true,
        body: JSON.stringify({ name: "Priya ji", message: msg, _subject: "Priya ji maan gayi! 🎉💖", _template: "box" })
      })
        .then(function (r) { return r.json() }).then(function (j) { if (j && (j.success === "true" || j.success === true)) ok = true }).catch(function () { });
      Promise.all([p1, p2]).then(function () { st.textContent = ok ? "💌 Sameer ko khabar mil gayi, woh bhi khush! 🥰" : "" });
    }
    function confetti() {
      var c = ["💖", "🎉", "✨", "💕", "🌸", "🥳"], h = document.getElementById("hearts");
      for (var i = 0; i < 40; i++) {
        var s = document.createElement("span"); s.textContent = c[i % c.length];
        s.style.cssText = "left:" + Math.random() * 100 + "%;font-size:" + (18 + Math.random() * 22) + "px;animation-duration:" + (3 + Math.random() * 4) + "s;animation-delay:" + Math.random() * 1.5 + "s;opacity:.9"; h.appendChild(s)
      }
    }
    (function () {
      var h = document.getElementById("hearts"), c = ["💗", "💕", "🌷", "💖"];
      for (var i = 0; i < 14; i++) {
        var s = document.createElement("span"); s.textContent = c[i % 4];
        s.style.cssText = "left:" + Math.random() * 100 + "%;font-size:" + (16 + Math.random() * 18) + "px;animation-duration:" + (8 + Math.random() * 8) + "s;animation-delay:" + Math.random() * 8 + "s"; h.appendChild(s)
      }
    })();
    render();
